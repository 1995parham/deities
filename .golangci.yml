---
version: "2"
linters:
  default: all
  disable:
    - depguard
    # we don't use json with camel-case
    - tagliatelle
    - nolintlint
    # it should improve to support more known patterns
    - varnamelen
    - ireturn
    - revive
    - wrapcheck
    - noinlineerr
    # deprecated aliases of exhaustruct_v5 / gomodguard_v2 / wsl_v5, which `all` already enables
    - exhaustruct
    - gomodguard
    - wsl
  settings:
    gosec:
      excludes:
        # Password field in registry auth config is not a secret literal
        - G117
